name: Skill evals (live model)

# Runs the claude plugin eval suite against a real model. It costs money and
# varies run to run, so it only runs on demand. The deterministic checks on the
# same suite run on every push, in ci.yml (tests/skill/).
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case
        default: '3'
      threshold:
        description: Fail if any case scores below this (0 to 1)
        default: '1.0'
      max_cost_usd:
        description: Hard cost ceiling for the whole run
        default: '5'

jobs:
  evals:
    name: claude plugin eval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Require the API key secret
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Set the ANTHROPIC_API_KEY repository secret to run live evals."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Pinned to match ci.yml; bump both together.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.285
      # Inputs go through env, not ${{ }} in the script, so they can't inject shell.
      - name: Run the eval suite
        env:
          RUNS: ${{ inputs.runs }}
          THRESHOLD: ${{ inputs.threshold }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
        run: >
          claude plugin eval .
          --trust-plugin
          --allow-tools Write "Bash(node *)"
          --no-publish
          --runs "$RUNS"
          --threshold "$THRESHOLD"
          --max-cost-usd "$MAX_COST_USD"
          --json evals/results/result.json
          --report evals/results/report.html
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-eval-results
          path: evals/results/
          if-no-files-found: ignore
