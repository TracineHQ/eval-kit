name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js:
    name: JS tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test js/test/stats.test.mjs

  python:
    name: Python tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package
        working-directory: python
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: python
        run: pytest

  lint:
    name: Lint and typecheck (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package
        working-directory: python
        run: pip install -e ".[dev]"
      - name: ruff check
        working-directory: python
        run: ruff check . ../tests
      - name: ruff format
        working-directory: python
        run: ruff format --check . ../tests
      - name: mypy (strict)
        working-directory: python
        run: mypy
      - name: JS syntax
        run: for f in js/cli.mjs js/lib/stats.mjs js/examples/*.mjs js/test/*.mjs tests/cross-validation/bridge.mjs; do node --check "$f"; done

  cross-validation:
    name: Cross-validation (Node ${{ matrix.node }} + Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
        python: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install Python package
        working-directory: python
        run: pip install -e ".[dev]"
      - name: Run cross-validation
        working-directory: python
        run: pytest ../tests/cross-validation/ -v

  skill:
    name: Skill contract (deterministic, no model calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install Python package
        working-directory: python
        run: pip install -e ".[dev]"
      - name: Eval answer keys, graders, SKILL.md limits, README output
        working-directory: python
        run: pytest ../tests/skill/ -v
      # Pinned so a Claude Code release can't break CI; bump deliberately.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.285
      - name: Validate plugin manifest
        run: claude plugin validate .
