name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --test js/test/stats.test.mjs

  python:
    name: Python tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package
        working-directory: python
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: python
        run: pytest

  min-deps:
    name: Dependency floor (Python 3.10, lowest direct dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Create venv
        working-directory: python
        run: uv venv .venv --python 3.10
      - name: Install package at the lowest allowed versions
        working-directory: python
        run: uv pip install --python .venv/bin/python --resolution lowest-direct -e ".[dev]"
      # The floor in pyproject.toml is only a promise if something installs it.
      - name: Check numpy and scipy sit at their floors
        working-directory: python
        shell: bash
        run: |
          uv pip list --python .venv/bin/python
          uv pip list --python .venv/bin/python | grep -Eq '^numpy +1\.24\.0( |$)' || { echo "::error::numpy is not at its floor, 1.24.0"; exit 1; }
          uv pip list --python .venv/bin/python | grep -Eq '^scipy +1\.13\.0( |$)' || { echo "::error::scipy is not at its floor, 1.13.0"; exit 1; }
      - name: Run tests
        working-directory: python
        run: .venv/bin/pytest
      - name: Run cross-validation
        working-directory: python
        run: .venv/bin/pytest ../tests/cross-validation/ -v

  lint:
    name: Lint and typecheck (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package
        working-directory: python
        run: pip install -e ".[dev]"
      - name: ruff check
        working-directory: python
        run: ruff check . ../tests
      - name: ruff format
        working-directory: python
        run: ruff format --check . ../tests
      - name: mypy (strict)
        working-directory: python
        run: mypy
      - name: JS syntax
        run: for f in js/cli.mjs js/lib/stats.mjs js/examples/*.mjs js/test/*.mjs tests/cross-validation/bridge.mjs; do node --check "$f"; done

  cross-validation:
    name: Cross-validation (${{ matrix.os }}, Node ${{ matrix.node }} + Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: ['20', '22', '24', '26']
        python: ['3.12']
        include:
          - os: ubuntu-latest
            node: '24'
            python: '3.10'
          - os: ubuntu-latest
            node: '24'
            python: '3.14'
          - os: macos-latest
            node: '24'
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install Python package
        working-directory: python
        run: pip install -e ".[dev]"
      - name: Run cross-validation
        working-directory: python
        run: pytest ../tests/cross-validation/ -v

  skill:
    name: Skill contract (deterministic, no model calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install Python package
        working-directory: python
        run: pip install -e ".[dev]"
      - name: Eval answer keys, graders, SKILL.md limits, README output
        working-directory: python
        run: pytest ../tests/skill/ -v
      # Pinned so a Claude Code release can't break CI; bump deliberately.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.285
      - name: Validate plugin manifest
        run: claude plugin validate .
