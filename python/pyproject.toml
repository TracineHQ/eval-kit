[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-kit"
version = "0.1.0"
description = "Did the eval get better, or is that noise? Welch's and paired t-tests, exact power analysis, and a verdict CLI that says 'can't tell yet' when the data can't support a call."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Anthony Ledesma" }]
keywords = ["llm", "evaluation", "statistics", "testing", "t-test", "power-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.scripts]
eval-kit = "eval_kit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/TracineHQ/eval-kit"
Repository = "https://github.com/TracineHQ/eval-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# A nested conditional expression reads worse than the if/else it replaces.
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

